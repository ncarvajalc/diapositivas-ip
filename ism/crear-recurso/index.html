	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

```ts
@Component({
  selector: 'app-crear-gato',
  imports: [ReactiveFormsModule],
  templateUrl: './crear-gato.html',
})
export class CrearGato {
  private gatoService = inject(GatoService);

  protected readonly guardando = signal(false);
  protected readonly exito = signal(false);
  protected readonly error = signal(false);

  protected gatoForm = new FormGroup({
    nombre: new FormControl<string>('', { nonNullable: true, validators: [Validators.required] }),
    raza: new FormControl<string>('', { nonNullable: true, validators: [Validators.required] }),
    edad: new FormControl<number>(0, {
      nonNullable: true,
      validators: [Validators.required, Validators.min(0)],
    }),
    color: new FormControl<string>('', { nonNullable: true, validators: [Validators.required] }),
    personalidad: new FormControl<string>('', {
      nonNullable: true,
      validators: [Validators.required],
    }),
    imagen: new FormControl<string>('', { nonNullable: true, validators: [Validators.required] }),
  });

  guardar(): void {
    if (this.gatoForm.invalid) return;
    this.guardando.set(true);
    this.exito.set(false);
    this.error.set(false);

    const { personalidad, ...resto } = this.gatoForm.getRawValue();
    const nuevoGato: NuevoGato = {
      ...resto,
      personalidad: personalidad
        .split(',')
        .map((rasgo) => rasgo.trim())
        .filter((rasgo) => rasgo.length > 0),
    };

    this.gatoService.create(nuevoGato).subscribe({
      next: (): void => {
        this.guardando.set(false);
        this.exito.set(true);
        this.gatoForm.reset();
        // Importante para obtener último gato
        this.gatoService.gatos.reload()
      },
      error: (): void => {
        this.guardando.set(false);
        this.error.set(true);
      },
    });
  }

  cancelar(): void {
    this.gatoForm.reset();
    this.exito.set(false);
    this.error.set(false);
  }
}

      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

	var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
