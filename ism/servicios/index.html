}

## DTO, Entity y JSON

El controller es el límite entre el API y la lógica de negocio.

<div style="width: 80%; margin-left: -10%; transform: scale(1.15); transform-origin: center;">


<div class="mermaid">
flowchart LR
    J[JSON] -->|Jackson| D[GatoDTO]
    D -->|ModelMapper| E[GatoEntity]
    E -->|ModelMapper| D2[GatoDTO]
    D2 -->|Jackson| J2[JSON]

</div>


</div>

- Jackson convierte entre JSON y DTO automáticamente en `@RequestBody`
- ModelMapper convierte entre DTO y Entity dentro del controller
- El service no conoce `GatoDTO`
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

<div style="font-size: 0.65em;">

## ¿Cómo usamos ModelMapper?

Primero agregamos la dependencia en el `pom.xml`.

```xml
<dependency>
    <groupId>org.modelmapper</groupId>
    <artifactId>modelmapper</artifactId>
    <version>3.2.4</version>
</dependency>
```

Luego creamos `ModelMapperConfig.java`.

```java
@Configuration
public class ModelMapperConfig {

    @Bean
    public ModelMapper modelMapper() {
        return new ModelMapper();
    }
}
```

- `@Bean` deja el `ModelMapper` disponible para inyectarlo
- Mapea los atributos que tienen el mismo nombre en el DTO y en la entidad
- Reemplaza los métodos de conversión que escribíamos a mano en el DTO

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.72em;">

## Un controller ligero

```java
@RestController
@RequestMapping("/gatos")
public class GatoController {
    private final GatoService gatoService;
    private final ModelMapper modelMapper;

    @PostMapping
    @ResponseStatus(HttpStatus.CREATED)
    public GatoDTO crearGato(@RequestBody GatoDTO gato)
            throws IllegalOperationException {
        GatoEntity entidad = modelMapper.map(gato, GatoEntity.class);
        return modelMapper.map(gatoService.create(entidad), GatoDTO.class);
    }
}
```

- `@RequestMapping` agrupa el recurso `/gatos`
- `@PostMapping` declara el verbo HTTP
- `@RequestBody` recibe un DTO convertido desde JSON

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Por qué el controller no retorna entidades?

Un refugio tiene gatos y cada gato conoce a su refugio.

- Si Jackson serializa un `RefugioEntity`, recorre su lista `gatos`
- Cada gato apunta de nuevo a su refugio y el recorrido no termina
- El JSON también expondría la estructura interna de la base de datos

El controller siempre responde con un DTO
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

<div style="font-size: 0.8em;">

| DTO | Contenido | Se usa en |
| --- | --- | --- |
| `<Entidad>DTO` | Atributos básicos, sin colecciones | El cuerpo de `POST` y `PUT`, y su respuesta |
| `<Entidad>DTOCompleto` | El DTO básico y las colecciones de asociaciones | La respuesta de los `GET` |

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

<div style="font-size: 0.7em;">

## `RefugioDTO` y `RefugioDTOCompleto`

```java
@Data
@NoArgsConstructor
@AllArgsConstructor
public class RefugioDTO {
    private Long id;
    private String nombre;
    private String direccion;
    private String telefono;
    private Integer capacidad;
}

@Data
@NoArgsConstructor
@EqualsAndHashCode(callSuper = true)
public class RefugioDTOCompleto extends RefugioDTO {
    private List<GatoDTO> gatos = new ArrayList<>();
}
```

- `RefugioDTOCompleto` hereda los atributos básicos y agrega la colección
- La lista usa `GatoDTO`, no `GatoDTOCompleto`
- ModelMapper llena `gatos` porque el atributo se llama igual en la entidad y en el DTO
- `GatoEntity` no tiene colecciones de asociaciones, así que le basta `GatoDTO`

</div>

`GET /refugios/1`

  "id": 1,
  "nombre": "Huellitas",

  "gatos": [

  ]
}
```

Cada gato es un `GatoDTO`, que no incluye a su refugio. El JSON es un árbol y no vuelve a su punto de partida.

## Un controller que responde `DTOCompleto`

```java
@RestController
@RequestMapping("/refugios")
public class RefugioController {

    @GetMapping("/{id}")
    public RefugioDTOCompleto obtenerRefugio(@PathVariable Long id)
            throws EntityNotFoundException {
        return modelMapper.map(refugioService.findById(id),
                RefugioDTOCompleto.class);
    }

    @PostMapping
    @ResponseStatus(HttpStatus.CREATED)
    public RefugioDTO crearRefugio(@RequestBody RefugioDTO refugio)
            throws IllegalOperationException {
        RefugioEntity entidad = modelMapper.map(refugio, RefugioEntity.class);
        return modelMapper.map(refugioService.create(entidad), RefugioDTO.class);
    }
}
```

- Los `GET` responden `RefugioDTOCompleto`
- `POST` y `PUT` reciben y responden `RefugioDTO`

## Reglas y recursos inexistentes

```java
public GatoEntity findById(Long id) throws EntityNotFoundException {
    return gatoRepository.findById(id)
        .orElseThrow(() -> new EntityNotFoundException(
            "No existe el gato con id " + id));
}

public GatoEntity create(GatoEntity gato)
        throws IllegalOperationException {
    validate(gato);
    return gatoRepository.save(gato);
}

private void validate(GatoEntity gato) throws IllegalOperationException {
    if (gato.getNombre() == null || gato.getNombre().isBlank()) {
        throw new IllegalOperationException("El nombre es obligatorio");
    }
    if (gato.getEdad() == null || gato.getEdad() < 0 || gato.getEdad() > 25) {
        throw new IllegalOperationException("La edad debe estar entre 0 y 25");
    }
}
```

- `EntityNotFoundException`: el id no existe
- `IllegalOperationException`: la operación incumple una regla

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->¿Qué códigos HTTP les corresponden?

</div>

## Las excepciones las creamos nosotros

Java no trae `EntityNotFoundException` ni `IllegalOperationException`. Son dos clases del proyecto, una por cada tipo de error de negocio.

```java
public class EntityNotFoundException extends Exception {
    public EntityNotFoundException(String message) {
        super(message);
    }
}

public class IllegalOperationException extends Exception {
    public IllegalOperationException(String message) {
        super(message);
    }
}
```

- Cada una vive en su propio archivo, junto al resto de clases del backend
- Extienden `Exception`, por eso los métodos que las lanzan declaran `throws`
- El service las lanza con `throw new ...` y el mensaje viaja en el constructor

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Luego haremos la correspondencia con los códigos de error correspondientes

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Actualizar y borrar

```java
public GatoEntity update(Long id, GatoEntity gato)
        throws EntityNotFoundException, IllegalOperationException {
    GatoEntity existente = findById(id);
    validate(gato);

    existente.setNombre(gato.getNombre());
    existente.setEdad(gato.getEdad());
    // ... demás atributos

    return gatoRepository.save(existente);
}

public void delete(Long id) throws EntityNotFoundException {
    gatoRepository.delete(findById(id));
}
```

`update` y `delete` reutilizan `findById`. Así el `404` es el mismo en todas las operaciones.

</div>

## Una entidad, un repository

Cada service inyecta únicamente el repository de su entidad.

```text
GatoController → GatoService → GatoRepository
RefugioController → RefugioService → RefugioRepository
```

Si una operación necesita otra entidad, el service usa el otro service. No accede a su repository directamente.

Esto evita que `GatoService` conozca cómo persiste `RefugioEntity`.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

## ¿Cómo llegan al cliente?

<div style="width: 80%; margin-left: -10%; transform: scale(1.15); transform-origin: center;">


<div class="mermaid">
flowchart LR
    S[Service lanza la excepción] --> C[Controller la deja pasar]
    C --> H[RestExceptionHandler la atrapa]
    H --> R[Respuesta HTTP código y mensaje]

</div>


</div>

El controller no decide el error. Solo declara `throws` y la excepción sigue su camino hasta el manejador.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.62em;">

## El manejador de excepciones

Es una clase más que creamos nosotros. Spring la encuentra solo por su anotación.

```java
@RestControllerAdvice
public class RestExceptionHandler {

    @ExceptionHandler(EntityNotFoundException.class)
    @ResponseStatus(HttpStatus.NOT_FOUND)
    public String handleEntityNotFound(EntityNotFoundException exception) {
        return exception.getMessage();
    }

    @ExceptionHandler(IllegalOperationException.class)
    @ResponseStatus(HttpStatus.BAD_REQUEST)
    public String handleIllegalOperation(IllegalOperationException exception) {
        return exception.getMessage();
    }
}
```

- `@RestControllerAdvice` atiende las excepciones de todos los controllers
- `@ExceptionHandler` indica qué tipo de excepción atiende cada método
- `@ResponseStatus` define el código HTTP: `EntityNotFoundException` responde `404` e `IllegalOperationException` responde `400`
- El método retorna el mensaje que el service puso en la excepción

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

## API completa para un recurso



| HTTP | Ruta | Controller | Service | Éxito |
| --- | --- | --- | --- | --- |
| `GET` | `/gatos` | convierte entidades a DTO | `findAll()` | `200` |
| `GET` | `/gatos/{id}` | convierte entidad a DTO | `findById(id)` | `200` |
| `POST` | `/gatos` | convierte DTO a entidad | `create(gato)` | `201` |
| `PUT` | `/gatos/{id}` | convierte DTO a entidad | `update(id, gato)` | `200` |
| `DELETE` | `/gatos/{id}` | no devuelve cuerpo | `delete(id)` | `204` |


En un recurso con colecciones, como `/refugios`, los `GET` responden `<Entidad>DTOCompleto`.

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

## ¿Se acuerdan de CORS?

Angular corre en `localhost:4200` y el backend en `localhost:8080`. El puerto hace parte del origen, así que son orígenes distintos.

- El navegador, no Spring, descarta la respuesta si el backend no la autoriza con `Access-Control-Allow-Origin`

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.7em;">

## `CorsConfig`

En lugar de `@CrossOrigin` en cada controller, declaramos una sola clase.

```java
@Configuration
public class CorsConfig implements WebMvcConfigurer {

    @Override
    public void addCorsMappings(CorsRegistry registry) {
        registry.addMapping("/**")
                .allowedOrigins("http://localhost:4200",
                                "http://172.23.66.11:4200")
                .allowedMethods("GET", "POST", "PUT", "DELETE");
    }
}
```

- `addMapping("/**")` aplica la regla a todas las rutas
- `allowedOrigins` lista dónde corre el front. Usen la IP de su máquina
- `allowedMethods` debe incluir `PUT` y `DELETE`, o el `OPTIONS` falla con `403`
- La clase va en el mismo paquete de `@SpringBootApplication` o en un subpaquete. Si no, Spring la ignora

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

	var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
