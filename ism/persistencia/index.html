		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}

## ¿Dónde estamos?

Hasta ahora el backend guarda los datos en memoria.

- El `InMemoryRepository` carga datos desde `datos.json`
- Los `GET` y el `POST` ya hablan con el frontend
- Cuando reiniciamos la aplicación, ese estado vuelve a su punto de partida

Ahora vamos a reemplazar ese mock por tablas reales.

## El problema con los gatos en memoria

Un refugio registra a Milo J y luego crea una adopción.

- La aplicación puede consultar a Milo J durante esa ejecución
- Si se detiene el backend, la adopción deja de existir en memoria
- Dos partes del sistema no comparten una fuente confiable de datos

Necesitamos guardar el estado fuera de los objetos que viven en la aplicación.

</div>

## Persistencia

Ya la conocen de Fundamentos de bases de datos.

En nuestro proyecto:

- Java trabaja con objetos como `GatoEntity`
- La base de datos trabaja con filas y columnas
- Java Persistence API (JPA) conecta esas dos representaciones
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

Un refugio administra gatos y registra adopciones.

<div style="font-size: 0.8em;">

## Objetos y tablas no se conectan igual

En Java navegamos una relación con referencias.

```java
gato.getRefugio().getNombre();
```

En una base de datos, la relación vive en una llave foránea.

```text
GATO_ENTITY.REFUGIO_ID = REFUGIO_ENTITY.ID
```

JPA traduce entre las referencias de Java y las llaves de la base de datos. A esto se le llama _impedance mismatch_

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## JPA y Hibernate

- JPA define el estándar de persistencia para Java
- Hibernate es la implementación que usa Spring Boot. Es quien traduce las entidades de Java y sus relaciones a tablas
- Las anotaciones indican cómo mapear clases, atributos y relaciones

JPA evita que escribamos SQL a mano, pero hay que entender las tablas que genera.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Del código Java a las tablas

<div style="font-size: 0.75em;">

| Clase Java | Tabla generada | Columnas principales |
| --- | --- | --- |
| `GatoEntity` | `GATO_ENTITY` | `ID`, `NOMBRE`, `EDAD`, `MICROCHIP`, `REFUGIO_ID` |
| `RefugioEntity` | `REFUGIO_ENTITY` | `ID`, `NOMBRE`, `CAPACIDAD` |

</div>

`REFUGIO_ID` en `GATO_ENTITY` es la llave foránea que referencia `REFUGIO_ENTITY.ID`.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.75em;">

## `BaseEntity`

Todas las entidades necesitan un identificador. En lugar de repetir ese campo en cada clase, el proyecto lo declara una sola vez en `BaseEntity`.

```java
@MappedSuperclass
@Getter
@Setter
public abstract class BaseEntity {

    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;
}
```

- `@Id` marca la llave primaria
- `@GeneratedValue` deja que la base de datos asigne el identificador
- `@MappedSuperclass` no crea una tabla propia
- Las entidades que la extienden reciben la columna `ID`

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Una entidad JPA

<div style="font-size: 0.75em;">

```java
@Entity
@Getter
@Setter
@NoArgsConstructor
public class GatoEntity extends BaseEntity {

    @Column(nullable = false)
    private String nombre;

    private Integer edad;

    @Column(unique = true)
    private String microchip;
}
```

- `@Entity` indica que JPA debe mapear la clase a una tabla
- Cada atributo simple se convierte en una columna
- JPA necesita un constructor vacío

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Convenciones que ayudan

- `GatoDTO` pasa a `GatoEntity`
- Una entidad extiende `BaseEntity`
- JPA genera el nombre de tabla. Se puede cambiar con la anotación `@Table`
- JPA genera el nombre de columna. Se puede cambiar con la anotación  `@Column`
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## H2 para el proyecto

H2 es una base de datos relacional escrita en Java. Spring Boot puede ejecutarla junto con la aplicación.

```properties
spring.datasource.url=jdbc:h2:mem:gatitos
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
```

- `jdbc:h2:mem:` crea una base temporal en memoria
- Si se quiere usar un archivo se puede usar `jdbc:h2:file:`
- Existe una consola que queda disponible en  el path `/h2-console` cuando está habilitada
- En Spring Boot 4, la consola también necesita la dependencia `spring-boot-h2console`

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## La relación gato-refugio

Un refugio puede albergar muchos gatos. Cada gato pertenece a un refugio.


<div class="mermaid">
erDiagram
    REFUGIO_ENTITY ||--o{ GATO_ENTITY : alberga
    REFUGIO_ENTITY {
        bigint id PK
        varchar nombre
        integer capacidad
    }
    GATO_ENTITY {
        bigint id PK
        varchar nombre
        varchar microchip
        bigint refugio_id FK
    }

</div>


La llave foránea está en la tabla del lado "muchos".
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.7em;">

## El lado propietario

El lado propietario guarda la llave foránea. En la relación gato-refugio, ese lado es `GatoEntity`. La relación aparece como otro atributo de la clase.

```java
@Entity
@Getter
@Setter
@NoArgsConstructor
public class GatoEntity extends BaseEntity {

    @Column(nullable = false)
    private String nombre;

    private Integer edad;

    @Column(unique = true)
    private String microchip;

    @ManyToOne
    @JoinColumn(name = "refugio_id")
    private RefugioEntity refugio;
}
```

`@JoinColumn` nombra la columna que JPA crea o usa en `GATO_ENTITY`.

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.7em;">

## El lado inverso

`RefugioEntity` puede conocer sus gatos, aunque no guarda una segunda llave foránea. La lista también es un atributo de la entidad.

```java
@Entity
@Getter
@Setter
@NoArgsConstructor
public class RefugioEntity extends BaseEntity {

    @Column(nullable = false)
    private String nombre;

    private Integer capacidad;

    @OneToMany(mappedBy = "refugio", cascade = CascadeType.ALL)
    private List<GatoEntity> gatos = new ArrayList<>();
}
```

`mappedBy = "refugio"` apunta al atributo dueño de la relación en `GatoEntity`.

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Actualizar los dos lados en Java

En una relación bidireccional, el código debe mantener ambas referencias consistentes.

```java
public void agregarGato(GatoEntity gato) {
    gatos.add(gato);
    gato.setRefugio(this);
}
```

Si solo agregamos el gato a `refugio.getGatos()`, JPA no recibe el cambio del lado propietario.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cardinalidad y tablas

<div style="font-size: 0.8em;">

| En el dominio | En JPA | En la base de datos |
| --- | --- | --- |
| Un refugio y muchos gatos | `@OneToMany` y `@ManyToOne` | Llave foránea en `GATO_ENTITY` |
| Una mascota y una ficha única | `@OneToOne` | Una llave foránea con restricción única |
| Gatos y campañas de adopción | `@ManyToMany` | Tabla intermedia con dos llaves foráneas |

La cardinalidad viene del modelo del dominio.

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Relaciones unidireccionales y bidireccionales

- Una relación unidireccional permite navegar en un solo sentido
- Una relación bidireccional permite navegar desde las dos entidades
- El lado inverso usa `mappedBy`

Declaren solo los recorridos que el código necesita. Una relación extra hace más difícil mantener las entidades y puede crear ciclos al serializarlas.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Cuándo cargar una relación?

```java
@OneToMany(mappedBy = "refugio", fetch = FetchType.LAZY)
private List<GatoEntity> gatos = new ArrayList<>();
```

- `LAZY` carga la colección cuando el código la necesita
- `EAGER` carga la relación junto con la entidad principal

No carguen colecciones grandes sin una razón concreta.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.6em;">

## Valores simples que se repiten

Si un gato tiene varios rasgos, pero cada rasgo no necesita identidad propia, usamos `@ElementCollection`. `rasgos` es otro atributo de `GatoEntity`.



```java
@Entity
@Getter
@Setter
@NoArgsConstructor
public class GatoEntity extends BaseEntity {

    @Column(nullable = false)
    private String nombre;

    private Integer edad;

    @Column(unique = true)
    private String microchip;

    @ManyToOne
    @JoinColumn(name = "refugio_id")
    private RefugioEntity refugio;

    @ElementCollection
    @CollectionTable(
        name = "gato_rasgos",
        joinColumns = @JoinColumn(name = "gato_id")
    )
    @Column(name = "rasgo")
    private Set<String> rasgos = new HashSet<>();
}
```



JPA crea una tabla para los rasgos. No necesitamos una entidad `RasgoEntity`.

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

INSERT INTO REFUGIO_ENTITY (id, nombre, capacidad)

## ¿Cómo ejecuta Spring Boot `data.sql`?

<div style="font-size: 0.72em;">

```text
src/main/resources/
├── application.properties
└── data.sql
```

```properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}
