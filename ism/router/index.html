		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){

			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}

## ¿Por qué importa tener una buena UI?

- **Confianza**: una interfaz descuidada hace dudar de todo el producto
- **Errores**: una pantalla confusa lleva a datos mal ingresados, y eso cuesta soporte y correcciones
- **Eficiencia**: una tarea de segundos se vuelve un recorrido de minutos
- **Accesibilidad**: contraste, tamaños y navegación por teclado deciden quién puede usar el producto
- **Abandono**: el usuario que no entiende la pantalla se va a otro producto
- **Costo de cambio**: rehacer la interfaz al final es más caro que diseñarla bien al inicio

## Una aplicación de una sola página

- Single Page Application (SPA)
- Angular cambia la vista con JavaScript, sin pedir una página nueva al servidor
- Sin Router, la aplicación no tiene URLs que compartir
- El botón atrás no sirve y recargar la página regresa al inicio

El Router conecta la URL con la vista. **La URL es el estado de lo que se ve.**
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

- **Definir las rutas**: la tabla que asocia cada URL con una vista
- **Llamar las rutas**: con un enlace en el template o desde el código
- **Indicar dónde se muestra la vista**: el "hueco" dentro del layout

## Spring y Angular hacen lo mismo en dos lugares

| | Back (Spring) | Front (Angular Router) |
| --- | --- | --- |
| Asocia | Una URL con un método del controller | Una URL con un componente |
| Se define con | `@GetMapping("/{id}")` | `{ path: 'gatos/:id', component: ... }` |
| Se ejecuta en | El servidor | El navegador |
| Produce | JSON | Una vista |
| Si nada coincide | `404` | La vista de "no encontrado" |

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.75em;">

## Activar el Router

```typescript
// app.config.ts
import { provideRouter, withComponentInputBinding } from '@angular/router';
import { routes } from './app.routes';

export const appConfig: ApplicationConfig = {
  providers: [
    provideHttpClient(),
    provideRouter(routes, withComponentInputBinding()),
  ],
};
```

- `provideRouter` se registra igual que `provideHttpClient()`
- `withComponentInputBinding()` entrega los parámetros de la URL como `input()` del componente

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.6em;">

## Definir las rutas

```typescript
// app.routes.ts
export const routes: Routes = [
  { path: '', redirectTo: 'gatos', pathMatch: 'full' },
  { path: 'gatos', component: ListaGatos, title: 'Gatos' },
  { path: 'gatos/nuevo', component: CrearGato, title: 'Nuevo gato' },
  { path: 'gatos/:id', component: DetalleGato, title: 'Gato' },
  { path: 'refugios', component: ListaRefugios, title: 'Refugios' },
  { path: 'refugios/:id', component: DetalleRefugio, title: 'Refugio' },
  { path: 'refugios/:id/add-gato', component: AsociarGato, title: 'Asociar gato' },
  { path: '**', component: NoEncontrado, title: 'No encontrado' },
];
```

Un arreglo de tipo `Routes`. Cada entrada asocia un `path` con un `component`. El `title` cambia el título de la pestaña.

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.75em;">

## El orden de las rutas importa

**El Router usa la primera ruta que coincide.**

- `redirectTo` en la raíz necesita `pathMatch: 'full'`. Sin él, Angular lanza el error `NG04014` al arrancar
- `gatos/nuevo` va **antes** de `gatos/:id`, porque `:id` también coincide con `nuevo`
- La comodín `'**'` va **al final**: atiende cualquier URL que no coincidió antes

La comodín muestra una vista de "no encontrado", el equivalente del `404` del back.

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.62em;">

## Dónde se muestra la vista

```html
<!-- app.html -->
<nav class="navbar ...">
  ...
</nav>

<main class="container py-4">
  <router-outlet ></router>
</main>
```

```typescript
// app.ts
@Component({
  imports: [RouterOutlet, RouterLink, RouterLinkActive],
  ...
})
export class App {}
```

- `<router-outlet ></router>` es el hueco donde Angular pinta el componente de la ruta activa
- Lo que lo rodea, como el menú, permanece al cambiar de ruta
- Las vistas ya no se importan en `App`: las carga el Router

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

## Llamar una ruta con `routerLink`

```html
<a routerLink="/gatos">Gatos</a>

<a [routerLink]="['/gatos', gato().id]">Ver detalle</a>
```

| | `href` | `routerLink` |
| --- | --- | --- |
| ¿Recarga la página? | Sí | No |
| ¿Conserva el estado de la aplicación? | No | Sí |

- Con expresiones se usa `[routerLink]` y un arreglo de segmentos: `['/gatos', id]`
- El componente que tiene el enlace debe importar `RouterLink`

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

<div style="font-size: 0.7em;">

## El menú con `routerLinkActive`

```html
<a class="nav-link" routerLink="/gatos"
   routerLinkActive="active" ariaCurrentWhenActive="page">Gatos</a>
```

- Agrega la clase `active` al enlace de la vista actual. Así el usuario sabe cuál link está activo al darle clic
- Por defecto compara por **prefijo**: `/gatos` queda activo en `/gatos/3` y en `/gatos/nuevo`
- Si un ítem es prefijo de otro, y no queremos que ambos se marquen, usamos coincidencia exacta:

```html
<a routerLink="/gatos" routerLinkActive="active"
   [routerLinkActiveOptions]="{ exact: true }">Gatos</a>
```

El componente con el menú debe importar `RouterLink` y `RouterLinkActive`.

</div>

## Parámetros de ruta

`gatos/:id` tiene un segmento variable. El componente lo recibe como un `input()` del **mismo nombre**.

```typescript
export class DetalleGato {
  readonly id = input.required<string>();
}
```

- Funciona gracias a `withComponentInputBinding()`
- El valor llega como **texto**. Si necesitamos un número, lo convertimos: `Number(this.id())`

## Navegar desde el código

```typescript
private readonly router = inject(Router);

this.router.navigate(['/refugios', this.id()]);
```

Usa el mismo arreglo de segmentos que `routerLink`.

**2 casos:**

- Si el usuario ve y pulsa un enlace: `routerLink`
- Si la navegación es consecuencia de otra acción, como volver al detalle después de guardar o de asociar: `router.navigate`

## Dos formas de mostrar un detalle

| Aspecto | Detalle en memoria | Detalle por ruta |
| --- | --- | --- |
| Origen del dato | Lo que la lista ya tiene | El servidor, con el `id` de la URL |
| URL propia | No | Sí |
| Al recargar | Se pierde | Se conserva |
| Enlace compartible | No | Sí |
| Petición extra | No | Sí, una por detalle |

**Para decidir**

- ¿La lista ya trae todo lo que el detalle necesita?
- ¿El detalle debe tener su propio enlace?
- ¿Necesita información que solo tiene el servidor?

## El servicio: una URL que depende del `id`

```typescript
@Injectable({ providedIn: 'root' })
export class GatoService {
  gatoResource(id: () => string | undefined): HttpResourceRef<Gato | undefined> {
    return httpResource<Gato>(() => {
      const valor: string | undefined = id();
      return valor ? `${environment.baseUrl}/gatos/${valor}` : undefined;
    });
  }
}
```

- En vez de un texto fijo, `httpResource` recibe una **función** que devuelve la URL
- Si esa función lee un signal, Angular la ejecuta de nuevo cuando el signal cambia y hace una petición nueva
- Si devuelve `undefined`, no hay petición

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

## El componente de detalle

```typescript
export class DetalleGato {
  private readonly gatoService = inject(GatoService);

  readonly id = input.required<string>();

  protected readonly recurso = this.gatoService.gatoResource(() => this.id());

  protected readonly gato = computed(() =>
    this.recurso.hasValue() ? this.recurso.value() : undefined,
  );

  protected readonly noExiste = computed(() => {
    const error: unknown = this.recurso.error();
    return error instanceof HttpErrorResponse && error.status === 404;
  });
}
```

El recurso se crea al inicializar el campo, que es un contexto de inyección.

## Un mismo componente, dos formas de llamarlo

Los tutoriales del Release 8 hacen que un mismo detalle sirva para los **dos tipos**.

- **Desde un padre** (`<app-detalle ></app>`): lee una signal compartida que llenó el clic de la lista
- **Desde una ruta** (`gatos/:id`): recibe el `id`, pide el recurso y copia la respuesta a la misma signal

```typescript
readonly id = input<string>();   // opcional: sin ruta queda undefined

constructor() {
  effect(() => {
    if (!this.id()) return;      // sin id, la lista ya llenó la signal
    this.gatoService.seleccionar(
      this.recurso.hasValue() ? this.recurso.value() : undefined);
  });
}
```

Con `hasValue()` se evita leer un recurso en error. Mientras carga o si falla, la selección queda vacía para no mostrar el gato anterior.

## `hasValue()` antes de `value()`

Un `httpResource` tiene tres estados:

| Estado | `isLoading()` | `error()` | `hasValue()` | `value()` |
| --- | --- | --- | --- | --- |
| Cargando | `true` | `undefined` | `false` | `undefined` |
| Con datos | `false` | `undefined` | `true` | Los datos |
| Con error | `false` | El error | `false` | **Lanza una excepción** |

- En estado de error, `value()` lanza una excepción y rompe la vista
- `value() ?? []` no basta: la excepción ocurre antes de que actúe el `??`
- Siempre preguntamos `hasValue()` primero, también dentro de un `computed` o un `effect`

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.62em;">

## Manejo de errores del back

`HttpClient` y `httpResource` entregan un `HttpErrorResponse`.

| `status` | Qué pasó | Qué mostramos |
| --- | --- | --- |
| `0` | Sin respuesta: servidor caído o bloqueo del navegador (CORS) | Un mensaje general, no hay cuerpo que leer |
| `400` | El back rechazó la operación por una regla de negocio | El mensaje del service |
| `404` | El recurso no existe | El mensaje del service o uno propio |

```typescript
export function leerMensaje(error: HttpErrorResponse): string {
  if (error.status === 0) {
    return 'No se pudo conectar con el servidor.';
  }
  return typeof error.error === 'string' ? error.error : 'No se pudo completar la operación.';
}
```

Nuestro `RestExceptionHandler` responde el mensaje como texto. Si un back responde JSON, el mensaje está en `error.error.message`.

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

## `POST` sin cuerpo

Asociar dos recursos que ya existen: los dos ids viajan en la URL y no hay nada que enviar.

```typescript
asociarGato(refugioId: number, gatoId: number): Observable<RefugioCompleto> {
  return this.http.post<RefugioCompleto>(
    `${environment.baseUrl}/refugios/`${refugioId}/gatos/$`{gatoId}`,
    null,
  );
}
```

- El segundo argumento es `null`: la petición sale sin cuerpo y sin `Content-Type`
- La respuesta sí trae datos: el `RefugioDTOCompleto` actualizado, por eso se tipa
- Necesita de `.subscribe(...)` para su envío

## `[ngValue]`, la opción inicial y el control

```typescript
protected readonly form = new FormGroup({
  gatoId: new FormControl<number | null>(null, { validators: [Validators.required] }),
});
```

- **`[ngValue]` y no `[value]`**: con `[value]` el id llega como texto (`"4"`). Con `[ngValue]` llega como número
- **Opción inicial** `[ngValue]="null"`: "Elige un gato". Con `Validators.required`, el botón sigue deshabilitado hasta que el usuario elija
- **Sin `nonNullable`**: un selector sin elección no tiene un valor natural de tipo `number`, por eso el tipo es `number | null`
- **`FormGroup` obligatorio**: un `<form>` sin `[formGroup]` no dispara `(ngSubmit)` y la página se recarga

## El componente de asociación: los datos

```typescript
export class AsociarGato {
  private readonly refugioService = inject(RefugioService);
  private readonly router = inject(Router);

  readonly id = input.required<string>();
  protected readonly gatos = inject(GatoService).gatos;   // las opciones: GET /gatos

  protected readonly form = new FormGroup({
    gatoId: new FormControl<number | null>(null, { validators: [Validators.required] }),
  });
  protected readonly guardando = signal(false);
  protected readonly mensajeError = signal('');
}
```

- El componente es del módulo dueño (refugios) e inyecta `GatoService` para las opciones
- `guardando` deshabilita el botón mientras viaja la petición
- `mensajeError` guarda el mensaje que dice el back

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<div style="font-size: 0.68em;">

## El componente de asociación: asociar

```typescript
asociar(): void {
  const gatoId = this.form.controls.gatoId.value;
  if (gatoId === null) return;
  this.guardando.set(true);
  this.mensajeError.set('');
  this.refugioService.asociarGato(Number(this.id()), gatoId).subscribe({
    next: () => {
      this.guardando.set(false);
      this.refugioService.refugios.reload();
      this.router.navigate(['/refugios', this.id()]);
    },
    error: (error: HttpErrorResponse) => {
      this.guardando.set(false);
      this.mensajeError.set(leerMensaje(error));
    },
  });
}
```

</div>
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#2E3440" -->

## Después de asociar

- **Si salió bien**: pedimos de nuevo la lista de refugios (`refugios.reload()`) porque trae los gatos de cada uno, y navegamos al detalle con `router.navigate`
- El detalle crea su recurso al abrirse, así que pide el refugio actualizado y muestra el gato recién asociado
- **Si salió mal**: nos quedamos en la vista y mostramos el mensaje del back

| Situación | Lo que ve el usuario |
| --- | --- |
| El gato ya está en otro refugio | `El gato ya pertenece a otro refugio` |
| El refugio está lleno | `El refugio ya alcanzó su capacidad` |
| El servidor está caído | `No se pudo conectar con el servidor.` |

</div>

## Desasociar desde el detalle

```typescript
quitar(gatoId: number): void {
  this.refugioService.desasociarGato(Number(this.id()), gatoId).subscribe({
    next: () => {
      this.recurso.reload();
      this.refugioService.refugios.reload();
    },
    error: (error: HttpErrorResponse) => this.mensajeError.set(leerMensaje(error)),
  });
}
```

- `DELETE /refugios/{id}/gatos/{gatoId}` responde `204` sin cuerpo
- `recurso.reload()` vuelve a pedir el refugio y la lista queda actualizada
- Desasociar no borra el gato: queda libre para asociarlo a otro refugio
